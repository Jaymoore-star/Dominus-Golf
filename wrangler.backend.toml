# Backend API Worker — the Hono app in backend/index.ts.
#
# This is deliberately NOT called wrangler.toml. Cloudflare Workers Builds picks
# up wrangler.toml automatically on every push to main, and that slot belongs to
# the frontend. When the backend lived in wrangler.toml, the Git build faithfully
# built backend/index.ts and deployed it as a second, secret-less copy of the API
# instead of the website. Keeping the backend under an explicit filename means a
# push can never redeploy or clobber it.
#
# Deploy with:  npm run deploy:backend
# Run locally:  npm run dev:backend      (reads .dev.vars, serves 127.0.0.1:8787)

name = "dominus-golf-backend"
main = "backend/index.ts"
compatibility_date = "2024-11-01"

# The login has access to more than one account, so pin the target explicitly —
# otherwise deploys prompt, and in CI they fail. This is the business account.
account_id = "d52c80b6632554c75458cf115c6d74b0"

# Local dev reads secrets from .dev.vars automatically.
# For production, set these with:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN -c wrangler.backend.toml
# The -c matters — without it wrangler reads wrangler.toml and targets the
# frontend Worker, which would put backend secrets on the public site Worker.
#
# Order recording (backend/orders.ts) needs these five in addition to the
# Square/Resend ones already set:
#
# This file is tracked in git. Names only — never paste a value here. Real values
# go in .dev.vars for local dev (gitignored) and into `wrangler secret put` for
# production.
#
#   SQUARE_WEBHOOK_SIGNATURE_KEY  Square Dashboard → Developer → Webhooks →
#                                 Subscriptions, shown beside the subscription.
#                                 Every request is rejected without it.
#   SQUARE_WEBHOOK_URL            The notification URL exactly as typed into that
#                                 subscription. Square signs URL + body, so a
#                                 mismatch of even a trailing slash fails every
#                                 signature. Configured rather than read from the
#                                 request because behind Cloudflare the inbound
#                                 URL can differ from what Square was given.
#   SUPABASE_URL                  Same project as the frontend's VITE_SUPABASE_URL.
#   SUPABASE_SERVICE_ROLE_KEY     Required: the orders table has no insert policy,
#                                 so the anon key cannot write. This key bypasses
#                                 RLS entirely — it belongs only here, never in
#                                 .env or any VITE_ variable, which ship to the
#                                 browser.
#   GOAFFPRO_ACCESS_TOKEN         Optional. GoAffPro admin → Settings → Integrations
#                                 → API. Without it orders still record and the
#                                 referral code is still stored; only the report to
#                                 GoAffPro is skipped.

# Daily at 16:00 UTC (noon US Eastern): send the review-request emails that are
# due. See backend/reviewRequests.ts. It sends nothing until
# REVIEW_REQUESTS_ENABLED is "true", because the first run also emails every past
# customer - read the preview (GET /api/admin/review-requests) before switching
# it on.
[triggers]
crons = ["0 16 * * *"]

# No [vars] block, deliberately: a deploy replaces every plain-text var on the
# Worker with what this file lists, so adding one here would silently delete any
# set in the dashboard. The switch below is a secret instead, which deploys leave
# alone.
#
# Three more secrets for the email list and review requests:
#
#   REVIEW_REQUESTS_ENABLED  "true" to let review-request emails send. Unset or
#                            anything else = preview only, nothing sent.
#
#   ADMIN_TOKEN              Any long random string. Guards the review-request
#                            preview and manual run. With none set, those routes
#                            refuse every request.
#   REVIEW_REQUEST_EXCLUDE   Optional, comma-separated. Addresses never asked for
#                            a review (testers using a personal address).
#                            @dominusgolf.com addresses are always excluded.
