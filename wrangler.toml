# Frontend Worker — serves the built site from dist/ as static assets.
#
# This file is what Cloudflare Workers Builds reads on every push to main, so it
# must describe the WEBSITE. The backend API lives in wrangler.backend.toml; see
# the note there for why they are separate.
#
# `main` points at a fallback handler that runs ONLY when no static asset
# matches the request. Cloudflare serves matching assets directly and does not
# invoke the Worker for them (`run_worker_first` defaults to false), so every
# real page still has no JavaScript in its request path — the property this
# Worker had when it was assets-only. See worker/index.ts for why it was added:
# without it, every unknown URL returned the home page under a 200, which Google
# reported as Soft 404.

name = "tit"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
account_id = "d52c80b6632554c75458cf115c6d74b0"

# Workers Builds runs `wrangler deploy`, and wrangler runs this first. Keeping the
# build command in the repo rather than the dashboard means the build is
# reproducible and reviewable, and nobody needs dashboard access to change it.
[build]
command = "npm run build"

[assets]
directory = "./dist"

# Binding the fallback Worker reads /index.html and /404.html through.
binding = "ASSETS"

# Serve /product/tour-pure-men directly from product/tour-pure-men/index.html,
# and redirect the trailing-slash form to it.
#
# The default ("auto-trailing-slash") does the opposite: it 307s /product/x to
# /product/x/. Every canonical, og:url and sitemap entry this site emits is
# written WITHOUT a trailing slash, so the default meant each of those URLs
# redirected before serving — telling crawlers the canonical URL is not the one
# actually serving the page. Verified with `wrangler dev`: default gave
# "307 Location: /product/tour-pure-men/", this setting gives a direct 200.
html_handling = "drop-trailing-slash"

# "none" hands unmatched requests to the Worker in worker/index.ts, which decides
# between the SPA shell and a real 404. It does NOT mean the site stops serving
# deep links: every route is prerendered to its own HTML file by vite.config.ts,
# and asset matching happens before any of this.
#
# It was "single-page-application", which returns dist/index.html with a 200 for
# anything unmatched. Because dist/index.html IS the prerendered home page, every
# unknown URL served the home page under a 200 with the home page's canonical —
# reported by Search Console on 16 Sep 2026 as Soft 404. worker/index.ts has the
# full diagnosis and why "404-page" was not the answer either.
#
# Deliberately still NOT public/_redirects. That file once held
# `/* /index.html 200`, and Cloudflare's docs are explicit that "redirects are
# always followed, regardless of whether or not an asset matches the incoming
# request" — so a catch-all rewrite would have shadowed the per-route HTML that
# the prerender step writes, silently undoing all of it.
#
# Asset matching still wins over the fallback, and html_handling below resolves
# /product/tour-pure-men to that route's prerendered index.html. The Worker only
# sees URLs with no prerendered file at all.
not_found_handling = "none"
