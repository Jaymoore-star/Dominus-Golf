<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts are SELF-HOSTED as of 17 Sep 2026. The @font-face rules live in
       src/fonts.css and are inlined into the CSS bundle by Vite, so there is no
       font stylesheet request at all - see the header of that file.

       What this replaced: a <link> to fonts.googleapis.com, which cost a
       serialised three-origin chain before a glyph could paint - document, then
       the Google stylesheet, then the woff2 from fonts.gstatic.com. The
       preconnects below it removed the handshakes but not the round trip: the
       browser cannot know which font files it needs until that CSS arrives.

       Two problems were also found in that request and fixed on the way:
       INTER was downloaded on every page and applied nowhere (`font-inter`
       appears zero times in the markup), and DM SANS stopped at weight 600
       while `font-bold` (700) is used 241 times, so most bold body copy on the
       site was being faux-bolded by the browser.

       The two preloads are the only faces an English page actually needs -
       DM Sans and Playfair, latin subset, upright. They start downloading in
       parallel with the CSS instead of after it. Italic and latin-ext are
       declared with a unicode-range and are fetched only if a page uses them,
       so they are deliberately NOT preloaded.

       `crossorigin` is required even though these are same-origin: font
       requests are always made in CORS mode, and without it the browser
       fetches the file twice and the preload is wasted. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/dm-sans-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/playfair-latin.woff2" />

  <!-- seo:start
      Sitewide fallback tags for crawlers that do not execute JavaScript -
      notably social link unfurlers (Facebook, WhatsApp, iMessage, LinkedIn).
      Once the app mounts, the router manages the head and removes everything
      marked data-static-seo so the live DOM has no duplicates. See src/App.tsx.

      At build time the prerender plugin in vite.config.ts REPLACES everything
      between the seo:start and seo:end markers with the real per-route tags,
      once per route, writing dist/<route>/index.html. What is written here is
      only the fallback for unmatched URLs. Do not remove the markers - without
      them the plugin has nothing to substitute and every page ships this
      generic copy instead.
    -->
  <title data-static-seo>Dominus Golf - Golf Training Systems, Apparel &amp; Accessories</title>
  <meta data-static-seo name="description"
    content="Golf training systems, apparel, and accessories from Dominus Golf. Train swing path and plane with equipment built for a repeatable swing." />
  <meta data-static-seo property="og:site_name" content="Dominus Golf" />
  <meta data-static-seo property="og:type" content="website" />
  <meta data-static-seo property="og:title" content="Dominus Golf - Golf Training Systems, Apparel &amp; Accessories" />
  <meta data-static-seo property="og:description"
    content="Golf training systems, apparel, and accessories from Dominus Golf. Train swing path and plane with equipment built for a repeatable swing." />
  <meta data-static-seo property="og:url" content="https://www.dominusgolf.com/" />
  <meta data-static-seo property="og:image" content="https://www.dominusgolf.com/og-default.jpg" />
  <meta data-static-seo property="og:locale" content="en_US" />
  <meta data-static-seo name="twitter:card" content="summary_large_image" />
  <meta data-static-seo name="twitter:title"
    content="Dominus Golf - Golf Training Systems, Apparel &amp; Accessories" />
  <meta data-static-seo name="twitter:description"
    content="Golf training systems, apparel, and accessories from Dominus Golf." />
  <meta data-static-seo name="twitter:image" content="https://www.dominusgolf.com/og-default.jpg" />
  <!-- seo:end -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
